<!DOCTYPE html>
<html>
<head>
  <title>Taskmaster</title>
  <style>
    body { width: 400px; padding: 20px; font-family: '"Courier New", Courier, monospace'; background-color: #FFD700; color: #000; margin: 0; }
    h2, h4 { text-transform: uppercase; font-weight: 900; letter-spacing: -1px; margin-top: 0; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; margin-bottom: 15px; padding: 10px; background: #fff; border: 3px solid #000; box-shadow: 4px 4px 0px #000; font-weight: bold; }
    .completed { text-decoration: line-through; color: #555; background: #ddd; }
    input[type="text"] { width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box; border: 3px solid #000; font-family: inherit; font-weight: bold; font-size: 1rem; box-shadow: 4px 4px 0px #000; }
    input[type="text"]:focus { outline: none; background: #f0f0f0; }
    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-weight: bold; font-size: 1.1rem; }
    input[type="checkbox"] { width: 20px; height: 20px; border: 2px solid #000; cursor: pointer; accent-color: #FF4757; margin-right: 5px; vertical-align: middle; }
    button { background: #FF4757; color: #000; border: 3px solid #000; padding: 8px 15px; cursor: pointer; font-family: inherit; font-weight: 900; box-shadow: 4px 4px 0px #000; transition: transform 0.1s, box-shadow 0.1s; font-size: 1rem; text-transform: uppercase; }
    button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #000; }
    hr { border: 2px solid #000; margin: 25px 0; }
    p { font-weight: bold; font-size: 14px; margin-bottom: 10px; color: #000 !important; }
    input[type="file"] { border: 3px solid #000; padding: 5px; background: #fff; font-family: inherit; font-weight: bold; cursor: pointer; box-shadow: 4px 4px 0px #000; margin-bottom: 15px; width: 100%; box-sizing: border-box; }
    #previewContainer img { border: 2px solid #000; box-shadow: 2px 2px 0px #000; margin-right: 5px; }
  </style>
</head>
<body>
  <h2>🎯 My Tasks</h2>
  <input type="text" id="taskInput" placeholder="What needs to be done?">
  <div class="controls">
    <label><input type="checkbox" id="dailyCheck"> Daily?</label>
    <button id="addBtn">Add Task</button>
  </div>
  <ul id="taskList"></ul>
  <hr>
  
  <h4>🤡 The Slacker Images</h4>
  <p style="font-size: 12px; color: gray;">Upload multiple images for maximum chaos.</p>
  
  <input type="file" id="imageInput" accept="image/*" multiple>
  <div id="previewContainer" style="display: flex; gap: 5px; margin-top: 10px; overflow-x: auto;"></div>
  
  <script src="popup.js"></script>
</body>
</html>
